<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Vibers Discovery — say what’s on your mind and step into the rooms where people think like you.">
<title>Vibers Discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Vibers Discovery — pearl-white spatial world. Graphite type; faint blue, violet and electric-cyan accents. */
:root {
  --ink: #171B26; --ink2: #3A4154; --muted: #6A7288; --silver: #AEB6C8; --line: rgba(23,27,38,.10); --line2: rgba(23,27,38,.18);
  --pearl: #F6F8FC; --white: #fff; --blue: #4F6BFF; --violet: #8B7CFF; --cyan: #35C8E8; --coral: #FF765F;
  --glass: rgba(255,255,255,.86); --shadow: 0 18px 50px -20px rgba(55,75,150,.38), 0 2px 6px rgba(30,40,80,.06);
  --r: 18px; --ease: cubic-bezier(.22,.9,.24,1); --spring: cubic-bezier(.34,1.3,.5,1);
  --f: Manrope, 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--pearl); color: var(--ink); font: 500 15px/1.45 var(--f); overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input, textarea { font: inherit; color: inherit; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 3px; border-radius: 10px; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 10px; font-weight: 700; transition: top .2s; }
.skip:focus { top: 12px; }

/* ---------------- stage ---------------- */
.stage { position: fixed; inset: 0; z-index: 0; }
.stage canvas { display: block; touch-action: pan-y; }
.loadnote { position: fixed; left: 18px; bottom: 16px; z-index: 5; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity .5s; pointer-events: none; }
.loadnote.on { opacity: .9; }

/* ---------------- top bar ---------------- */
.top { position: fixed; z-index: 12; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 14px max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left)); padding-top: max(14px, env(safe-area-inset-top)); pointer-events: none; }
.top > * { pointer-events: auto; }
.sp { flex: 1; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 1rem; letter-spacing: -.02em; padding: 4px 10px 4px 4px; border-radius: 999px; }
.brand b { font-weight: 800; } .brand .bw { font-weight: 500; color: var(--ink2); white-space: nowrap; }
.mk { position: relative; width: 36px; height: 36px; border-radius: 12px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow); display: block; overflow: hidden; }
.mk i { position: absolute; inset: 7px; border-radius: 50%; border: 1.5px solid var(--blue); border-right-color: transparent; transform: rotate(-30deg); }
.mk i + i { inset: 12px; border-color: var(--cyan); border-left-color: transparent; border-right-color: var(--cyan); transform: rotate(30deg); }
.ctl { display: flex; gap: 8px; }
.cb { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); box-shadow: 0 6px 20px -12px rgba(40,60,130,.4); color: var(--ink2); transition: transform .2s var(--spring), background .2s, color .2s; }
.cb:hover { transform: translateY(-1px) scale(1.05); color: var(--ink); } .cb[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ---------------- hero ---------------- */
.hero { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
.hero > * { pointer-events: auto; }
.intro { position: absolute; left: 0; right: 0; top: clamp(62px, 9vh, 110px); text-align: center; padding: 0 20px; pointer-events: none; transition: opacity .6s var(--ease), transform .6s var(--ease), filter .6s; }
.intro::before { content: ''; position: absolute; inset: -24px 12% -14px; z-index: -1; background: radial-gradient(56% 62% at 50% 50%, rgba(246,248,252,.78), rgba(246,248,252,.5) 55%, rgba(246,248,252,0) 100%); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%); }
h1 { margin: 0; font-weight: 800; font-size: clamp(2rem, min(4.6vw, 8vh), 4.1rem); line-height: 1.02; letter-spacing: -.05em; color: var(--ink); text-wrap: balance; }
h1 .you { background: linear-gradient(95deg, var(--blue), var(--violet) 55%, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
body.formed .intro, body.in-room .intro { opacity: 0; transform: translateY(-14px) scale(.98); filter: blur(6px); pointer-events: none; }

.ask { position: absolute; left: 50%; top: 66%; width: min(720px, calc(100vw - 28px)); transform: translateX(-50%); transition: top .7s var(--ease); perspective: 900px; }
body.formed .ask { top: 70%; }
.bar { position: relative; display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 10px 0 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow), inset 0 1px 0 #fff; backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); transition: box-shadow .3s, border-color .3s, transform .5s var(--ease); animation: bob 7s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.bar:focus-within { border-color: rgba(79,107,255,.55); box-shadow: 0 26px 70px -22px rgba(79,107,255,.55), 0 0 0 4px rgba(79,107,255,.12), inset 0 1px 0 #fff; transform: scale(1.012); animation-play-state: paused; }
.bar .orbit { position: absolute; inset: -10px -26px; border-radius: 50%; border: 1px solid rgba(120,132,160,.28); transform: rotate(-3deg) scaleY(.82); pointer-events: none; }
.bar .orbit::after { content: ''; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 4px rgba(53,200,232,.2); left: 10%; top: 8%; animation: orb 9s linear infinite; }
@keyframes orb { 0% { left: 4%; top: 54%; } 25% { left: 50%; top: -2%; } 50% { left: 96%; top: 46%; } 75% { left: 50%; top: 99%; } 100% { left: 4%; top: 54%; } }
.ret { width: 38px; height: 38px; flex: none; fill: none; stroke: var(--ink2); stroke-width: 1.4; }
.ret .r1 { stroke: var(--blue); stroke-dasharray: 20 10; transform-origin: 50% 50%; animation: spin 14s linear infinite; } .ret .r2 { stroke: var(--cyan); } .ret .tk { stroke-linecap: round; stroke: var(--silver); }
.parsing .ret .r1 { animation-duration: 2.2s; }
@keyframes spin { to { transform: rotate(360deg); } }
#q { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
#q::placeholder { color: #8C94A8; font-weight: 500; }
.clr { width: 32px; height: 32px; border-radius: 50%; display: none; place-items: center; color: var(--muted); } .clr:hover { background: rgba(23,27,38,.06); } .has-text .clr { display: grid; }
.go { width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 24px -10px rgba(23,27,38,.6); transition: transform .25s var(--spring), background .2s; flex: none; }
.go:hover { transform: scale(1.06); background: var(--blue); } .go:active { transform: scale(.96); }
.scan { position: absolute; left: 28px; right: 28px; bottom: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--blue), var(--cyan), transparent); background-size: 40% 100%; background-repeat: no-repeat; opacity: 0; }
.parsing .scan { opacity: 1; animation: scan .9s linear infinite; } @keyframes scan { from { background-position: -40% 0; } to { background-position: 140% 0; } }

.read { margin-top: 12px; min-height: 36px; text-align: center; position: relative; left: 50%; transform: translateX(-50%); width: min(920px, 96vw); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.ch { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 6px 0 12px; border-radius: 999px; background: var(--white); border: 1px solid var(--line); font-weight: 700; font-size: .92rem; letter-spacing: -.01em; box-shadow: 0 8px 22px -14px rgba(40,60,130,.5); opacity: 0; transform: translateY(-16px) scale(.6); filter: blur(7px); transition: opacity .32s var(--ease), transform .45s var(--spring), filter .32s var(--ease), box-shadow .2s; transition-delay: calc(var(--i, 0) * 60ms); will-change: transform; }
.ch.in { opacity: 1; transform: none; filter: none; } .ch.out { opacity: 0; transform: scale(.7); filter: blur(5px); transition-delay: 0s; }
.ch .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px rgba(79,107,255,.14); }
.ch[data-h="lavender"] .dot { background: var(--violet); box-shadow: 0 0 0 3px rgba(139,124,255,.18); } .ch[data-h="coral"] .dot, .ch[data-h="lime"] .dot { background: var(--cyan); box-shadow: 0 0 0 3px rgba(53,200,232,.2); }
.ch .tx { padding-right: 2px; } .ch .why { position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); width: max-content; max-width: 260px; font-weight: 500; font-size: .78rem; line-height: 1.35; padding: 8px 10px; border-radius: 10px; background: var(--ink); color: #fff; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 5; }
.ch:hover .why, .ch:focus-within .why { opacity: 1; }
.ch .x { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); } .ch .x:hover { background: rgba(23,27,38,.08); color: var(--ink); } .ch .x .ico { width: 14px; height: 14px; }
.ch.intent { background: transparent; border-style: dashed; border-color: var(--line2); color: var(--ink2); box-shadow: none; }
.ch.not { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(23,27,38,.4); }
.ch.not .tx::before { content: 'Not '; text-decoration: none; display: inline-block; }
.ch.sug { background: transparent; border: 1px dashed var(--line2); color: var(--ink2); box-shadow: none; padding-right: 12px; } .ch.sug:hover { background: #fff; }
.ch.rm { background: transparent; border: 0; box-shadow: none; color: var(--muted); font-weight: 600; font-size: .82rem; height: 30px; padding: 0 10px; }
.line { margin: 8px auto 0; width: fit-content; max-width: 100%; font-size: .86rem; color: var(--ink2); min-height: 1.3em; padding: 3px 12px; border-radius: 999px; background: rgba(246,248,252,.78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.line b { color: var(--ink2); } .line button { color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.whyp { margin: 10px auto 0; max-width: 560px; text-align: left; font-size: .82rem; color: var(--ink2); background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
.whyp ul { margin: 4px 0 0; padding-left: 18px; }

.try { position: absolute; left: 50%; top: calc(66% + 126px); transform: translateX(-50%); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: min(820px, 94vw); transition: opacity .4s, transform .6s var(--ease); }
body.has-q .try, body.formed .try, body.in-room .try { opacity: 0; pointer-events: none; transform: translate(-50%, 10px); }
.tr { height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.7); border: 1px solid var(--line); font-weight: 600; font-size: .84rem; color: var(--ink2); transition: transform .2s var(--spring), background .2s, opacity .5s; } .tr:hover { background: #fff; transform: translateY(-2px); color: var(--ink); }
.tr.fade { opacity: 0; transform: translateY(6px); }

/* constellation of pathways */
/*PATHS*/ .paths { position: relative; left: 50%; width: min(1000px, 96vw); transform: translateX(-50%); margin-top: 8px; min-height: 0; pointer-events: none; opacity: 0; transition: opacity .5s var(--ease); }
body.formed .paths { opacity: 1; } .paths > * { pointer-events: auto; }
.paths svg.cn { position: absolute; left: 0; top: -22px; width: 100%; height: calc(100% + 22px); pointer-events: none; overflow: visible; }
.paths svg.cn path { fill: none; stroke: rgba(79,107,255,.28); stroke-width: 1.2; stroke-dasharray: 2 5; animation: dash 3s linear infinite; } @keyframes dash { to { stroke-dashoffset: -28; } }
.pwrap { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding-top: 10px; }
.pw { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; height: 46px; border-radius: 999px; background: #fff; border: 1px solid var(--line); box-shadow: 0 10px 26px -14px rgba(40,60,130,.55); font-weight: 800; font-size: .8rem; letter-spacing: .02em; text-transform: uppercase; opacity: 0; transform: translateY(14px) scale(.9); transition: transform .5s var(--spring), opacity .4s, box-shadow .2s, border-color .2s; transition-delay: calc(var(--i, 0) * 70ms); }
.pw.in { opacity: 1; transform: none; } .pw:hover, .pw:focus-visible, .pw.pre { border-color: rgba(79,107,255,.55); box-shadow: 0 16px 34px -14px rgba(79,107,255,.6); transform: translateY(-2px); transition-delay: 0s; }
.pw .avs { display: flex; } .pw .avs i { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; background: #E3E8F6 center/cover no-repeat; margin-left: -10px; display: grid; place-items: center; font-style: normal; font-size: .62rem; color: var(--ink2); } .pw .avs i:first-child { margin-left: 0; }
.pw .pt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; } .pw .pt small { font-weight: 600; font-size: .68rem; letter-spacing: 0; text-transform: none; color: var(--muted); }
.pw.all { background: var(--ink); color: #fff; border-color: var(--ink); } .pw.all small { color: rgba(255,255,255,.7); }

/* ---------------- formation ---------------- */
.formation { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
.fc { position: absolute; left: 0; top: 0; pointer-events: auto; border-radius: 14px; transform-origin: 50% 50%; opacity: 0; transition: opacity .35s; will-change: transform; }
.fc.on { opacity: 1; } .fc:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
.fc .lab { position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%) rotate(calc(var(--r, 0rad) * -1)); width: max-content; max-width: 190px; text-align: center; padding: 5px 10px 6px; border-radius: 12px; background: rgba(255,255,255,.92); border: 1px solid var(--line); box-shadow: 0 8px 22px -12px rgba(40,60,130,.5); line-height: 1.2; transition: opacity .3s, transform .3s var(--spring); pointer-events: none; }
.fc .lab b { display: block; font-size: .8rem; font-weight: 800; letter-spacing: -.01em; } .fc .lab i { display: block; font-style: normal; font-size: .7rem; font-weight: 600; color: var(--blue); }
.fc:hover .lab, .fc:focus-visible .lab { transform: translateX(-50%) rotate(calc(var(--r, 0rad) * -1)) translateY(-2px) scale(1.04); }
.fc .lab::before { content: ''; position: absolute; left: 50%; top: -5px; width: 1px; height: 5px; background: var(--blue); opacity: .5; }
body.in-room .fc .lab { opacity: 0; }
.tip { position: fixed; z-index: 20; pointer-events: none; padding: 8px 12px; border-radius: 12px; background: var(--ink); color: #fff; font-size: .78rem; line-height: 1.3; max-width: 240px; opacity: 0; transform: translate(-50%, -8px); transition: opacity .15s; box-shadow: 0 14px 30px -10px rgba(23,27,38,.5); }
.tip.on { opacity: 1; } .tip b { display: block; font-size: .86rem; } .tip span { color: #B8C4FF; }

/* ---------------- peek (profile) ---------------- */
.peek { position: fixed; z-index: 30; right: 0; top: 0; bottom: 0; width: min(400px, 100vw); background: rgba(255,255,255,.97); border-left: 1px solid var(--line); box-shadow: -30px 0 80px -40px rgba(30,45,110,.5); transform: translateX(104%); transition: transform .55s var(--ease); overflow: auto; padding: max(18px, env(safe-area-inset-top)) 22px 28px; outline: 0; }
.peek.on { transform: none; }
.peek .xb { position: absolute; right: 14px; top: max(14px, env(safe-area-inset-top)); width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; z-index: 2; }
.pk-ph { width: 100%; aspect-ratio: 4/3.5; border-radius: 22px; overflow: hidden; background: #E3E8F6; position: relative; box-shadow: 0 24px 50px -26px rgba(30,45,110,.6); margin-top: 38px; } .pk-ph img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .5s; } .pk-ph.ready img { opacity: 1; }
.pk-ph .ini { position: absolute; inset: 0; display: grid; place-items: center; font-size: 4rem; font-weight: 800; color: rgba(23,27,38,.3); }
.peek h2 { margin: 16px 0 2px; font-size: 1.6rem; letter-spacing: -.04em; line-height: 1.1; } .peek .role { color: var(--muted); font-weight: 600; margin: 0 0 4px; } .peek .where { display: inline-flex; gap: 6px; align-items: center; font-size: .82rem; color: var(--ink2); font-weight: 700; }
.peek p.bio { margin: 12px 0; color: var(--ink2); } .peek h3 { margin: 20px 0 8px; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; } .tg { height: 30px; padding: 0 11px; border-radius: 999px; background: var(--pearl); border: 1px solid var(--line); font-weight: 700; font-size: .8rem; } .tg:hover { background: #fff; border-color: rgba(79,107,255,.5); } .tg.sh { background: rgba(79,107,255,.08); border-color: rgba(79,107,255,.35); color: var(--blue); }
.reasons { margin: 0; padding-left: 18px; color: var(--ink2); font-size: .9rem; }
.rooms { display: grid; gap: 8px; } .rbtn { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: #fff; font-weight: 800; font-size: .8rem; letter-spacing: .03em; transition: border-color .2s, transform .2s var(--spring); } .rbtn:hover { border-color: rgba(79,107,255,.55); transform: translateX(2px); } .rbtn small { display: block; font-weight: 600; letter-spacing: 0; color: var(--muted); } .rbtn .ico { margin-left: auto; color: var(--blue); }
.note { font-size: .78rem; color: var(--muted); margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
.btn { height: 42px; padding: 0 18px; border-radius: 999px; font-weight: 800; background: var(--ink); color: #fff; display: inline-flex; align-items: center; gap: 8px; transition: transform .2s var(--spring), background .2s; } .btn:hover { background: var(--blue); transform: translateY(-1px); } .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line2); } .btn.ghost:hover { border-color: var(--blue); background: #fff; color: var(--blue); } .btn.sm { height: 34px; padding: 0 14px; font-size: .84rem; } .btn[disabled] { opacity: .45; pointer-events: none; } .btn.on { background: rgba(79,107,255,.1); color: var(--blue); border: 1px solid rgba(79,107,255,.4); }

/* ---------------- list view ---------------- */
.listview { position: fixed; inset: 0; z-index: 25; background: rgba(246,248,252,.97); overflow: auto; padding: 84px max(18px, 6vw) 40px; }
.listview h2 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: -.04em; } .listview h3 { margin: 26px 0 8px; font-size: .74rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lv { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); } .lv button { width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px; border-radius: 16px; background: #fff; border: 1px solid var(--line); } .lv button:hover { border-color: rgba(79,107,255,.5); }
.lv .ph { width: 46px; height: 58px; border-radius: 10px; background: #E3E8F6 center/cover; flex: none; } .lv b { display: block; } .lv small { color: var(--muted); font-weight: 600; display: block; }
body.list-on .stage, body.list-on .formation, body.list-on .paths, body.list-on .try { visibility: hidden; }

/* ---------------- dialogs & toasts ---------------- */
.dlg-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(23,27,38,.28); display: grid; place-items: center; padding: 18px; opacity: 0; pointer-events: none; transition: opacity .25s; } .dlg-wrap.on { opacity: 1; pointer-events: auto; }
.dlg { width: min(520px, 100%); max-height: 88vh; overflow: auto; background: #fff; border-radius: 24px; padding: 24px; box-shadow: 0 40px 100px -30px rgba(30,45,110,.6); transform: translateY(14px) scale(.98); transition: transform .35s var(--spring); outline: 0; } .dlg-wrap.on .dlg { transform: none; }
.dlg h3 { margin: 0 0 8px; font-size: 1.3rem; letter-spacing: -.03em; } .dlg p { margin: 8px 0; color: var(--ink2); } .dlg .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; position: sticky; bottom: -24px; background: linear-gradient(180deg, rgba(255,255,255,0), #fff 30%); padding-top: 10px; }
.dlg label { display: block; font-weight: 700; font-size: .82rem; margin: 12px 0 4px; } .dlg input[type=text], .dlg textarea { width: 100%; border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px; background: #fff; outline: 0; } .dlg input:focus, .dlg textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,107,255,.15); }
.dlg ul { padding-left: 18px; color: var(--ink2); } .dlg .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .88rem; } .dlg .ok { color: #0B8F5B; font-weight: 800; } .dlg .no { color: #B24B2B; font-weight: 800; }
